<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https:;"
    />
    <title>D&D Miniature Collection</title>
    <meta
      name="description"
      content="A filterable gallery of D&D miniatures hosted on GitHub Pages."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Quattrocento:wght@400;700&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap"
      rel="stylesheet"
    />
    <!-- The Lucide script is no longer needed and has been removed. -->
    <script>
      (() => {
        const key = "hiraeth-theme";
        let saved = null;
        try {
          saved = localStorage.getItem(key);
        } catch {}
        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : systemDark
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        --bg: #f2f2f2;
        --card: rgba(255, 255, 255, 0.85);
        --surface-2: rgba(248, 245, 241, 0.7);
        --muted: #61656a;
        --text: #2f3133;
        --primary: #7a2f26;
        --link: #bc9d76;
        --shelf: #aa5a32;
        --book: #4d7f4a;
        --chapter: #cfa067;
        --page: #c09054;
        --page-draft: #51407c;
        --accent: var(--link);
        --accent-2: var(--chapter);
        --ok: var(--book);
        --warn: var(--chapter);
        --danger: var(--shelf);
        --border: rgba(216, 216, 216, 0.6);
        --chip: var(--surface-2);
        --shadow: 0 12px 40px rgba(20, 18, 16, 0.08);
        --shadow-lg: 0 20px 50px rgba(20, 18, 16, 0.15);
        --toolbar-bg: rgba(255, 255, 255, 0.75);
        --media-bg: rgba(248, 245, 241, 0.95);
        --input-bg: rgba(255, 255, 255, 0.9);
        --overlay: rgba(47, 49, 51, 0.58);
        --overlay-strong: rgba(47, 49, 51, 0.9);
        --popup-surface: #ffffff;
        --popup-backdrop: #2f3133;
        --popup-strong-backdrop: #2f3133;
        --popup-control-bg: #ffffff;
        --list-row-alt: rgba(47, 49, 51, 0.035);
        --accent-2-soft: rgba(207, 160, 103, 0.16);
        --shimmer-0: rgba(255, 255, 255, 0);
        --shimmer-1: rgba(255, 255, 255, 0.55);
        --shimmer-2: rgba(255, 255, 255, 0.75);
        --on-accent: #151618;
        --on-strong: #ffffff;
        --radius: 12px;
        --radius-sm: 8px;
        --radius-lg: 16px;
        --font-header: "IM Fell English SC", serif;
        --font-body:
          "Cormorant Garamond", "EB Garamond", "Libre Baskerville",
          "Quattrocento", "Source Sans 3", serif;
        --font-ui:
          "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      html[data-theme="dark"] {
        --bg: #151618;
        --card: rgba(38, 41, 46, 0.65);
        --surface-2: rgba(30, 32, 36, 0.6);
        --muted: #b2b5bc;
        --text: #e6e7ea;
        --primary: #8e8abf;
        --link: #8380e2;
        --shelf: #f43d5a;
        --book: #16c4a1;
        --chapter: #e9ad4a;
        --page: #4aa1d8;
        --page-draft: #9a63db;
        --accent: var(--link);
        --accent-2: var(--chapter);
        --ok: var(--book);
        --warn: var(--chapter);
        --danger: var(--shelf);
        --border: rgba(58, 62, 70, 0.6);
        --chip: var(--surface-2);
        --shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.8);
        --toolbar-bg: rgba(21, 22, 24, 0.82);
        --media-bg: rgba(25, 26, 30, 0.95);
        --input-bg: rgba(30, 32, 36, 0.92);
        --overlay: rgba(0, 0, 0, 0.6);
        --overlay-strong: rgba(0, 0, 0, 0.9);
        --popup-surface: #26292e;
        --popup-backdrop: #000000;
        --popup-strong-backdrop: #000000;
        --popup-control-bg: #26292e;
        --list-row-alt: rgba(255, 255, 255, 0.02);
        --accent-2-soft: rgba(233, 173, 74, 0.16);
        --shimmer-0: rgba(255, 255, 255, 0);
        --shimmer-1: rgba(255, 255, 255, 0.05);
        --shimmer-2: rgba(255, 255, 255, 0.1);
        --on-accent: #151618;
        --on-strong: #ffffff;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      * {
        box-sizing: border-box;
      }

      *:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 500 16px/1.5 var(--font-body);
      }

      button,
      input,
      select,
      textarea,
      label {
        font-family: var(--font-ui);
      }

      .icon {
        width: 1em;
        height: 1em;
        stroke-width: 2.5;
        stroke: currentColor;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--accent);
        width: 0%;
        z-index: 1000;
        transition: width 0.4s ease;
      }

      header {
        padding: 24px 16px 8px;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        border-bottom: 1px solid var(--border);
      }

      .emblem {
        color: var(--accent);
        flex-shrink: 0;
      }

      .site-logo {
        transition: filter 0.2s ease;
      }

      html[data-theme="light"] .site-logo {
        filter: invert(1);
      }

      html[data-theme="dark"] .site-logo {
        filter: none;
      }

      .header-main {
        flex: 1 1 260px;
        min-width: 0;
      }

      header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.2px;
        font-family: var(--font-header);
      }

      header .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--toolbar-bg);
        backdrop-filter: blur(8px);
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 16px;
        display: grid;
        grid-template-columns: 1fr auto auto auto auto auto;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        align-items: center;
      }

      .toolbar input[type="search"] {
        width: 100%;
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        outline: none;
        font-family: var(--font-ui);
      }

      .toolbar select {
        padding: 10px 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        outline: none;
        font-family: var(--font-ui);
      }

      .toolbar .btn {
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: border-color 0.2s;
        font-family: var(--font-ui);
      }

      .toolbar .btn:hover,
      .toolbar .btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      .filters-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 16px;
        width: min(1100px, 92vw);
        max-height: min(70vh, 700px);
        overflow: auto;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-lg);
        z-index: 70;
        display: none;
      }

      .filters-dropdown.show {
        display: block;
      }

      .quick-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .quick-filters .chip {
        cursor: pointer;
        transition: all 0.2s;
      }
      .quick-filters .chip:hover {
        border-color: var(--accent-2);
        color: var(--accent-2);
      }
      .quick-filters .chip.active {
        border-color: var(--accent-2);
        background: var(--accent-2-soft);
        color: var(--accent-2);
      }

      .filters {
        margin-top: 8px;
      }

      .filters .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
      }

      .filters .groups {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
      }

      .group {
        border: 1px dashed var(--border);
        border-radius: var(--radius-sm);
        padding: 0;
      }

      .group summary {
        padding: 8px 10px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.2px;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: var(--font-ui);
      }
      .group summary::-webkit-details-marker {
        display: none;
      }
      .group summary .chevron {
        transition: transform 0.2s;
      }
      .group[open] summary .chevron {
        transform: rotate(90deg);
      }

      .group .opts {
        padding: 0 10px 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 180px;
        overflow: auto;
      }

      .group label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
        font-family: var(--font-ui);
      }
      .group label .count {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
        background: var(--bg);
        padding: 0 6px;
        border-radius: 4px;
        font-family: var(--font-ui);
      }

      .group input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .active-filters {
        max-width: 1100px;
        margin: 8px auto 0;
        padding: 0 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--muted);
        font-family: var(--font-ui);
      }

      .chip button {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
        display: inline-flex;
        align-items: center;
      }

      .grid {
        max-width: 1100px;
        margin: 12px auto 40px;
        padding: 0 16px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .grid.list-view {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .grid.list-view .card {
        flex-direction: row;
        align-items: center;
        gap: 12px;
        padding-right: 12px;
      }
      .grid.list-view .thumb {
        flex-shrink: 0;
        width: 100px;
        height: 75px;
        aspect-ratio: auto;
      }
      .grid.list-view .meta {
        flex-grow: 1;
      }
      .grid.list-view .ribbon {
        display: none;
      }

      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 240px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        cursor: pointer;
      }

      .card:hover,
      .card:focus-within {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
        border-color: var(--accent);
      }

      .ribbon {
        position: absolute;
        top: -1px;
        right: -1px;
        width: 120px;
        height: 120px;
        overflow: hidden;
        pointer-events: none;
      }
      .ribbon span {
        position: absolute;
        display: block;
        width: 180px;
        padding: 4px 0;
        color: var(--on-strong);
        text-align: center;
        font-size: 10px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transform: rotate(45deg) translateY(-20px);
        right: -30px;
        top: 32px;
        box-shadow: var(--shadow);
        white-space: nowrap;
      }
      .ribbon.ok span {
        background: var(--ok);
      }
      .ribbon.warn span {
        background: var(--warn);
      }
      .ribbon.danger span {
        background: var(--danger);
      }

      .thumb {
        background: var(--media-bg);
        aspect-ratio: 4 / 3;
        overflow: hidden;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .meta {
        padding: 10px 12px 12px;
        display: grid;
        gap: 6px;
      }

      .meta h3 {
        margin: 0;
        font-size: 16px;
        font-family: var(--font-header);
      }

      .line {
        font-size: 13px;
        color: var(--muted);
        font-family: var(--font-ui);
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 48px 24px;
        background: var(--card);
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
        margin-top: 24px;
      }
      .empty-state .icon {
        font-size: 48px;
        color: var(--accent);
        margin-bottom: 16px;
      }
      .empty-state h3 {
        margin: 0 0 8px;
        font-family: var(--font-header);
      }
      .empty-state p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .empty-state .btn {
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .skeleton {
        position: relative;
        overflow: hidden;
        background-color: var(--chip);
      }
      .skeleton::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          var(--shimmer-0) 0,
          var(--shimmer-1) 20%,
          var(--shimmer-2) 60%,
          var(--shimmer-0)
        );
        animation: shimmer 2s infinite;
      }
      .skeleton-img {
        width: 100%;
        aspect-ratio: 4/3;
      }
      .skeleton-text {
        height: 1em;
        border-radius: 4px;
        margin-bottom: 0.5em;
      }

      dialog {
        width: min(920px, 92vw);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 0;
        background: var(--popup-surface);
        color: var(--text);
        box-shadow: var(--shadow-lg);
      }

      dialog::backdrop {
        background: var(--popup-backdrop);
        backdrop-filter: none;
      }

      .modal-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-head h3 {
        margin: 0;
        font-size: 18px;
        flex-grow: 1;
        font-family: var(--font-header);
      }

      .modal-head .btn {
        flex-shrink: 0;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        padding: 0;
        display: flex;
        color: var(--text);
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 1px solid var(--border);
        transition: all 0.2s ease;
      }

      .modal-head .btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      .modal-head .btn .icon {
        width: 18px;
        height: 18px;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 16px;
      }

      .kv-group {
        margin-bottom: 16px;
      }
      .kv-group h4 {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.5px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-header);
      }
      .kv {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 6px 12px;
        font-size: 14px;
      }
      .kv div {
        padding: 4px 0;
        border-bottom: 1px dashed var(--border);
      }
      .kv .k {
        color: var(--muted);
      }

      .notes {
        margin-top: 10px;
        padding: 10px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
        white-space: pre-wrap;
      }

      .carousel-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
      }
      .carousel {
        position: relative;
        background: var(--media-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 4 / 3;
      }
      .carousel-track {
        display: flex;
        height: 100%;
        transition: transform 0.3s ease-in-out;
      }
      .carousel-slide {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .carousel-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-in;
      }
      .carousel-label {
        position: absolute;
        top: 8px;
        left: 8px;
        background: var(--popup-control-bg);
        color: var(--text);
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-family: var(--font-ui);
      }
      .carousel-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: var(--popup-control-bg);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 24px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-ui);
      }
      .carousel-nav.prev {
        left: 10px;
      }
      .carousel-nav.next {
        right: 10px;
      }
      .carousel-filmstrip {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .filmstrip-thumb {
        flex: 0 0 80px;
        width: 80px;
        height: 60px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        cursor: pointer;
        border: 2px solid transparent;
        transition: border-color 0.2s;
      }
      .filmstrip-thumb.active {
        border-color: var(--accent);
      }
      .filmstrip-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* FIXED: Lightbox is now full-screen */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--popup-strong-backdrop);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .lightbox.show {
        display: flex;
      }
      .lightbox-img {
        max-width: 95vw;
        max-height: 95vh;
        cursor: grab;
        transition: transform 0.2s ease;
        will-change: transform;
      }
      .lightbox-img.grabbing {
        cursor: grabbing;
      }
      .lightbox-btn {
        position: absolute;
        background: var(--popup-control-bg);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 2rem;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-ui);
      }
      .lightbox-close {
        top: 15px;
        right: 15px;
      }
      .lightbox-prev {
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
      }
      .lightbox-next {
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
      }

      footer {
        max-width: 1100px;
        margin: 16px auto 48px;
        padding: 0 16px;
        color: var(--muted);
        font-size: 13px;
        font-family: var(--font-ui);
      }
      /* Alternate row background for list view */
      .grid.list-view .card:nth-child(even) {
        background: var(--list-row-alt);
      }

      .theme-toggle {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        cursor: pointer;
        font-family: var(--font-ui);

          margin-left: 0;
        }

      /* Make list view more compact */
      .grid.list-view .card {

      .grid.list-view .thumb {

      .toast {

        background: var(--card);

        font-family: var(--font-ui);
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>

    <script>
      const DATA_URL = "data/minis.json";
      const STORAGE_KEY = "miniGalleryStateV2";
      const THEME_STORAGE_KEY = "hiraeth-theme";

      // ⚡ Bolt: Single regex pass with map lookup instead of 5 chained replace() calls
      const htmlEntityMap = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      };
      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, (m) => htmlEntityMap[m]);
      }

      const collator = new Intl.Collator(undefined, {
        numeric: true,
        sensitivity: "base",
      });

      const state = {
        query: "",
        sortBy: "name-asc",
        viewMode: "grid",
        filtersOpen: false,
        quickFilter: null,
        filters: {
          type: new Set(),
          size: new Set(),
          paint: new Set(),
          manufacturer: new Set(),
          painter: new Set(),
          room: new Set(),
          storage: new Set(),
          role: new Set(),
        },
      };

      let allMinis = [];
      let uniqueOptions = {
        type: [],
        size: [],
        paint: [],
        manufacturer: [],
        painter: [],
        room: [],
        storage: [],
        role: [],
      };

      // ⚡ Bolt: Cache DOM elements to avoid repetitive querySelectorAll calls during frequent renders
      const optionCountElements = {};
      const optionCountCache = {}; // Cache the current text content to avoid redundant DOM updates
      const checkboxElementsCache = {}; // Cache the checkbox elements to avoid redundant getElementById calls

      // ⚡ Bolt: Lookup map to avoid evaluating nested ternary expressions inside hot loops
      const filterValueGetters = {
        type: (m) => m.type,
        size: (m) => m.size,
        paint: (m) => m.paint.status,
        manufacturer: (m) => m.source.manufacturer,
        painter: (m) => m.paint.painter,
        room: (m) => m.location.room,
        storage: (m) => m.location.storage,
        role: (m) => m.usage.role,
      };

      const el = (sel) => document.querySelector(sel);
      const els = (sel) => [...document.querySelectorAll(sel)];

      const cssVar = (name) =>
        getComputedStyle(document.documentElement)
          .getPropertyValue(name)
          .trim();

      let PLACEHOLDER_SVG = "";

      function buildPlaceholderSvg() {
        const start = cssVar("--surface-2");
        const end = cssVar("--media-bg");
        const stroke = cssVar("--border");
        const text = cssVar("--muted");
        const svg =
          "<svg xmlns='http://www.w3.org/2000/svg' width='480' " +
          "height='360' viewBox='0 0 480 360'>" +
          "<defs><linearGradient id='g' x1='0' x2='1'>" +
          `<stop offset='0' stop-color='${start}'/>` +
          `<stop offset='1' stop-color='${end}'/></linearGradient></defs>` +
          "<rect width='100%' height='100%' fill='url(#g)'/>" +
          `<g fill='none' stroke='${stroke}' stroke-width='2'>` +
          "<rect x='24' y='24' width='432' height='312' " +
          "rx='16' ry='16'/>" +
          "<path d='M80 260l70-90 60 70 50-60 70 80'/>" +
          "<circle cx='140' cy='110' r='22'/></g>" +
          "<text x='50%' y='50%' dominant-baseline='middle' " +
          `text-anchor='middle' fill='${text}' font-family='system-ui' ` +
          "font-size='20'>No image</text></svg>";
        return (
          "data:image/svg+xml;utf8," +
          encodeURIComponent(svg).replace(/'/g, "%27")
        );
      }

      function refreshPlaceholderSvg() {
        PLACEHOLDER_SVG = buildPlaceholderSvg();
      }

      function resolveTheme() {
        let saved = null;
        try {
          saved = localStorage.getItem(THEME_STORAGE_KEY);
        } catch {}
        if (saved === "light" || saved === "dark") return saved;
        return window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      function updateThemeToggleUI() {
        const theme = document.documentElement.getAttribute("data-theme");
        const nextLabel =
          theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
        const btn = el("#headerThemeToggleBtn");
        if (!btn) return;
        btn.textContent = `Theme: ${theme === "dark" ? "Dark" : "Light"}`;
        btn.setAttribute("aria-label", nextLabel);
      }

      function applyTheme(theme, options = {}) {
        const { persist = true } = options;
        document.documentElement.setAttribute("data-theme", theme);
        if (persist) {
          try {
            localStorage.setItem(THEME_STORAGE_KEY, theme);
          } catch {}
        }
        refreshPlaceholderSvg();
        updateThemeToggleUI();
      }

      function toggleTheme() {
        const curr = document.documentElement.getAttribute("data-theme");
        applyTheme(curr === "dark" ? "light" : "dark");
        applyAndRender();
      }

      function initTheme() {
        applyTheme(resolveTheme(), { persist: false });
      }

      const ICONS = {
        grid: '<svg class="icon" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>',
        list: '<svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
        chevron:
          '<svg class="icon chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
      };

      let toastTimeout;
      function showToast(msg, isError = false) {
        let t = document.getElementById("toast");
        if (t) t.remove();

        t = document.createElement("div");
        t.id = "toast";
        t.className = "toast";
        t.setAttribute("role", "status");
        t.setAttribute("aria-live", "polite");

        const openDialog = document.querySelector("dialog[open]");
        if (openDialog) {
          openDialog.appendChild(t);
        } else {
          document.body.appendChild(t);
        }

        const icon = isError
          ? '<svg class="icon" viewBox="0 0 24 24" style="color:var(--danger)"><path d="M18 6 6 18"/><path d="M6 6 18 18"/></svg>'
          : '<svg class="icon" viewBox="0 0 24 24" style="color:var(--ok)"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        t.innerHTML = icon;
        const span = document.createElement("span");
        span.textContent = msg;
        t.appendChild(span);
        t.style.borderColor = isError ? "var(--danger)" : "var(--accent)";

        requestAnimationFrame(() => {
          t.classList.add("show");
        });

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          t.classList.remove("show");
          setTimeout(() => t.remove(), 300);
        }, 3000);
      }

      function showProgress(pct) {
        el("#progressBar").style.width = `${pct}%`;
      }

      function hideProgress() {
        showProgress(100);
        setTimeout(() => (el("#progressBar").style.width = "0%"), 500);
      }

      function renderSkeletons(count = 8) {
        const grid = el("#grid");
        grid.innerHTML = "";
        for (let i = 0; i < count; i++) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="thumb skeleton skeleton-img"></div>
            <div class="meta">
              <div class="skeleton skeleton-text" style="width: 80%;"></div>
              <div class="skeleton skeleton-text" style="width: 60%;"></div>
              <div class="skeleton skeleton-text" style="width: 90%;"></div>
            </div>
          `;
          grid.appendChild(card);
        }
      }

      async function init() {
        initTheme();
        renderSkeletons();
        showProgress(20);
        await loadData();
        showProgress(50);
        buildUniqueOptions();
        restoreState();

        // ✅ Auto-switch to list view on mobile if no saved preference
        if (!localStorage.getItem(STORAGE_KEY) && window.innerWidth < 768) {
          state.viewMode = "list";
        }

        buildFilterGroups();
        buildQuickFilters();
        wireControls();
        showProgress(70);
        applyAndRender();

        // ✅ Live resize detection
        window.addEventListener("resize", () => {
          if (window.innerWidth < 768 && state.viewMode !== "list") {
            state.viewMode = "list";
            updateViewModeUI();
            applyAndRender();
          }
        });

        requestAnimationFrame(() => {
          const params = new URLSearchParams(window.location.search);
          const miniId = params.get("id");
          if (miniId) {
            const targetMini = allMinis.find(
              (m) => m.id.toLowerCase() === miniId.toLowerCase(),
            );
            if (targetMini) {
              setTimeout(() => openDetail(targetMini), 50);
            }
          }
        });
      }

      async function loadData() {
        try {
          const res = await fetch(DATA_URL, { cache: "no-store" });
          if (!res.ok) throw new Error("Failed to load minis.json");
          const data = await res.json();
          allMinis = data.map((m) => normalizeMini(m));
        } catch (err) {
          console.error(err);
          allMinis = [];
        }
      }

      function normalizeMini(m) {
        const safe = (v, d = "") => (v == null ? d : v);
        const toArray = (v) => {
          if (Array.isArray(v)) return v;
          if (typeof v === "string" && v) return [v];
          return [];
        };

        const normalized = {
          id: safe(m.id),
          name: safe(m.name),
          type: safe(m.type),
          size: safe(m.size),
          source: {
            manufacturer: safe(m?.source?.manufacturer),
            set: safe(m?.source?.set),
            acquisition_date: safe(m?.source?.acquisition_date),
            acquisition_location: safe(m?.source?.acquisition_location),
            origin_type: safe(m?.source?.origin_type),
          },
          location: {
            room: safe(m?.location?.room),
            storage: safe(m?.location?.storage),
          },
          paint: {
            status: safe(m?.paint?.status),
            painter: safe(m?.paint?.painter),
            date: safe(m?.paint?.date),
            style: safe(m?.paint?.style),
            brand: toArray(m?.paint?.brand),
          },
          usage: {
            campaigns: toArray(m?.usage?.campaigns),
            role: safe(m?.usage?.role),
            frequency: safe(m?.usage?.frequency),
          },
          condition: safe(m?.condition),
          images: {
            main: toArray(m?.images?.main),
            before_paint: toArray(m?.images?.before_paint),
            after_paint: toArray(m?.images?.after_paint),
            ai_art: toArray(m?.images?.ai_art),
            reference: toArray(m?.images?.reference),
          },
          tags: toArray(m?.tags),
          notes: safe(m?.notes),
        };

        // ⚡ Bolt: Cache parsed dates to avoid expensive string parsing inside sort comparator (O(n log n) operations per sort)
        normalized._acqTime = normalized.source.acquisition_date
          ? Date.parse(normalized.source.acquisition_date) || 0
          : 0;
        normalized._paintTime = normalized.paint.date
          ? Date.parse(normalized.paint.date) || 0
          : 0;

        // Cache searchable text to avoid O(n) array operations on every keystroke
        normalized._searchText = [
          normalized.name,
          normalized.type,
          normalized.size,
          normalized.source.manufacturer,
          normalized.source.set,
          normalized.source.origin_type,
          normalized.location.room,
          normalized.location.storage,
          normalized.paint.status,
          normalized.paint.painter,
          normalized.notes,
          ...normalized.tags,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return normalized;
      }

      function buildUniqueOptions() {
        // ⚡ Bolt: Single pass over the dataset instead of 8 separate passes to build unique options
        const sets = {
          type: new Set(),
          size: new Set(),
          paint: new Set(),
          manufacturer: new Set(),
          painter: new Set(),
          room: new Set(),
          storage: new Set(),
          role: new Set(),
        };

        for (const m of allMinis) {
          if (m.type) sets.type.add(m.type);
          if (m.size) sets.size.add(m.size);
          if (m.paint.status) sets.paint.add(m.paint.status);
          if (m.source.manufacturer)
            sets.manufacturer.add(m.source.manufacturer);
          if (m.paint.painter) sets.painter.add(m.paint.painter);
          if (m.location.room) sets.room.add(m.location.room);
          if (m.location.storage) sets.storage.add(m.location.storage);
          if (m.usage.role) sets.role.add(m.usage.role);
        }

        uniqueOptions.type = [...sets.type].sort(collator.compare);
        uniqueOptions.size = [...sets.size].sort(collator.compare);
        uniqueOptions.paint = [...sets.paint].sort(collator.compare);
        uniqueOptions.manufacturer = [...sets.manufacturer].sort(
          collator.compare,
        );
        uniqueOptions.painter = [...sets.painter].sort(collator.compare);
        uniqueOptions.room = [...sets.room].sort(collator.compare);
        uniqueOptions.storage = [...sets.storage].sort(collator.compare);
        uniqueOptions.role = [...sets.role].sort(collator.compare);
      }

      function buildQuickFilters() {
        const cont = el("#quickFilters");
        cont.innerHTML = "";
        const filters = [
          { label: "Painted", key: "painted" },
          { label: "Primed", key: "primed" },
          { label: "Unpainted", key: "unpainted" },
          { label: "Needs Repair", key: "repair" },
        ];
        for (const f of filters) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.setAttribute("aria-pressed", "false");
          chip.className = "chip";
          chip.textContent = f.label;
          chip.dataset.key = f.key;
          chip.addEventListener("click", () => {
            state.quickFilter = state.quickFilter === f.key ? null : f.key;
            applyAndRender();
          });
          cont.appendChild(chip);
        }
      }

      function buildFilterGroups() {
        const cont = el("#filterGroups");
        cont.innerHTML = "";
        const groups = [
          ["Type", "type"],
          ["Size", "size"],
          ["Paint Status", "paint"],
          ["Manufacturer", "manufacturer"],
          ["Painter", "painter"],
          ["Role", "role"],
          ["Room", "room"],
          ["Storage", "storage"],
        ];
        for (const [label, key] of groups) {
          cont.appendChild(renderGroup(label, key, uniqueOptions[key]));
        }
      }

      function renderGroup(label, key, values) {
        const g = document.createElement("details");
        g.className = "group";
        const summary = document.createElement("summary");
        summary.innerHTML = `
          <span>${label}</span>
          ${ICONS.chevron}
        `;
        g.appendChild(summary);

        const opts = document.createElement("div");
        opts.className = "opts";
        for (const v of values) {
          const id = `f_${key}_${slug(v)}`;
          const lab = document.createElement("label");
          lab.setAttribute("for", id);
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.id = id;
          cb.value = v;
          cb.checked = state.filters[key]?.has(v);
          cb.addEventListener("change", () => {
            toggleFilter(key, v, cb.checked);
          });
          const span = document.createElement("span");
          span.textContent = v;
          const countSpan = document.createElement("span");
          countSpan.className = "count";
          countSpan.textContent = "0";

          // ⚡ Bolt: Cache the count span element directly during creation
          optionCountElements[`${key}_${v}`] = countSpan;
          optionCountCache[`${key}_${v}`] = "0";
          checkboxElementsCache[`${key}_${v}`] = cb;

          lab.appendChild(cb);
          lab.appendChild(span);
          lab.appendChild(countSpan);
          opts.appendChild(lab);
        }
        g.appendChild(opts);
        return g;
      }

      function toggleFilter(key, value, checked) {
        const set = state.filters[key] || new Set();
        if (checked) set.add(value);
        else set.delete(value);
        state.filters[key] = set;
        applyAndRender();
      }

      function wireControls() {
        let searchTimeout;
        el("#search").addEventListener("input", (e) => {
          clearTimeout(searchTimeout);
          // ⚡ Bolt: Debounce search input to prevent expensive filtering and DOM updates on every keystroke
          searchTimeout = setTimeout(() => {
            state.query = e.target.value.trim();
            applyAndRender();
          }, 250);
        });
        el("#sortBy").addEventListener("change", (e) => {
          state.sortBy = e.target.value;
          applyAndRender();
        });
        el("#resetBtn").addEventListener("click", () => {
          resetState();
          buildFilterGroups();
          buildQuickFilters();
          applyAndRender();
        });
        el("#emptyResetBtn").addEventListener("click", () =>
          el("#resetBtn").click(),
        );
        el("#randomBtn").addEventListener("click", () => randomSelect());
        el("#viewModeBtn").addEventListener("click", () => toggleViewMode());
        el("#filtersToggleBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          setFiltersDropdownOpen(!state.filtersOpen);
        });
        el("#headerThemeToggleBtn").addEventListener("click", () =>
          toggleTheme(),
        );
        el("#closeDialogBtn").addEventListener("click", () =>
          el("#detailDialog").close(),
        );
        el("#filtersDropdown").addEventListener("click", (e) =>
          e.stopPropagation(),
        );
        document.addEventListener("click", (e) => {
          const btn = el("#filtersToggleBtn");
          const dropdown = el("#filtersDropdown");
          if (!state.filtersOpen || !btn || !dropdown) return;
          if (btn.contains(e.target) || dropdown.contains(e.target)) return;
          setFiltersDropdownOpen(false);
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (state.filtersOpen) {
              setFiltersDropdownOpen(false);
              return;
            }
            if (el("#lightbox").classList.contains("show")) {
              closeLightbox();
            } else {
              el("#detailDialog")?.close();
            }
          }
        });
      }

      function setFiltersDropdownOpen(open) {
        state.filtersOpen = Boolean(open);
        const dropdown = el("#filtersDropdown");
        const btn = el("#filtersToggleBtn");
        if (!dropdown || !btn) return;
        dropdown.classList.toggle("show", state.filtersOpen);
        dropdown.hidden = !state.filtersOpen;
        btn.setAttribute("aria-expanded", state.filtersOpen ? "true" : "false");
      }

      function resetState() {
        state.query = "";
        state.sortBy = "name-asc";
        state.quickFilter = null;
        for (const k of Object.keys(state.filters)) {
          state.filters[k] = new Set();
        }
        el("#search").value = "";
        el("#sortBy").value = state.sortBy;
        persistState();
      }

      function restoreState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          state.query = saved.query || "";
          state.sortBy = saved.sortBy || "name-asc";
          state.viewMode = saved.viewMode || "grid";
          for (const k of Object.keys(state.filters)) {
            const arr = saved.filters?.[k] || [];
            state.filters[k] = new Set(arr);
          }
          el("#search").value = state.query;
          el("#sortBy").value = state.sortBy;
          updateViewModeUI();
        } catch {}
      }

      function persistState() {
        const toSave = {
          query: state.query,
          sortBy: state.sortBy,
          viewMode: state.viewMode,
          filters: Object.fromEntries(
            Object.entries(state.filters).map(([k, s]) => [k, [...s]]),
          ),
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
      }

      function applyAndRender() {
        showProgress(30);
        persistState();

        setTimeout(() => {
          const filtered = filterMinis(allMinis);
          const sorted = sortMinis(filtered, state.sortBy);

          renderActiveChips();
          renderOptionCounts();
          updateQuickFilterUI();
          syncCheckboxes();

          if (sorted.length === 0) {
            renderEmptyState(true);
          } else {
            renderEmptyState(false);
            renderGrid(sorted);
          }

          renderStats(allMinis, filtered);
          hideProgress();
        }, 50);
      }

      function filterMinis(minis) {
        const q = state.query.toLowerCase();
        const f = state.filters;
        const qf = state.quickFilter;

        // ⚡ Bolt: Hoist set.size checks outside the loop to avoid redundant evaluations
        const emptyType = f.type.size === 0;
        const emptySize = f.size.size === 0;
        const emptyPaint = f.paint.size === 0;
        const emptyManufacturer = f.manufacturer.size === 0;
        const emptyPainter = f.painter.size === 0;
        const emptyRoom = f.room.size === 0;
        const emptyStorage = f.storage.size === 0;
        const emptyRole = f.role.size === 0;

        return minis.filter((m) => {
          // ⚡ Bolt: Early return to skip expensive set lookups if text search fails
          if (q && !(m._searchText || "").includes(q)) return false;

          const matchesFilters =
            (emptyType || f.type.has(m.type)) &&
            (emptySize || f.size.has(m.size)) &&
            (emptyPaint || f.paint.has(m.paint.status)) &&
            (emptyManufacturer || f.manufacturer.has(m.source.manufacturer)) &&
            (emptyPainter || f.painter.has(m.paint.painter)) &&
            (emptyRoom || f.room.has(m.location.room)) &&
            (emptyStorage || f.storage.has(m.location.storage)) &&
            (emptyRole || f.role.has(m.usage.role));

          if (!matchesFilters) return false;

          let matchesQuickFilter = true;
          if (qf) {
            const paintStatus = (m.paint.status || "").toLowerCase();
            if (qf === "painted")
              matchesQuickFilter = paintStatus === "painted";
            if (qf === "primed") matchesQuickFilter = paintStatus === "primed";
            if (qf === "unpainted")
              matchesQuickFilter =
                paintStatus === "unpainted" || paintStatus === "bare";
            if (qf === "repair")
              matchesQuickFilter =
                (m.condition || "").toLowerCase() === "needs repair";
          }

          return matchesQuickFilter;
        });
      }

      function sortMinis(minis, by) {
        const get = {
          "name-asc": (a, b) => collator.compare(a.name, b.name),
          "name-desc": (a, b) => collator.compare(b.name, a.name),
          "acq-new": (a, b) => b._acqTime - a._acqTime,
          "acq-old": (a, b) => a._acqTime - b._acqTime,
          "paint-new": (a, b) => b._paintTime - a._paintTime,
          "paint-old": (a, b) => a._paintTime - b._paintTime,
        }[by];
        return [...minis].sort(get || get["name-asc"]);
      }

      function renderActiveChips() {
        const wrap = el("#activeFilters");
        wrap.innerHTML = "";

        const createChip = (label, onRemove, ariaLabel) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = label;

          const btn = document.createElement("button");
          btn.setAttribute("aria-label", ariaLabel || `Remove filter ${label}`);
          btn.innerHTML = "✕";
          btn.addEventListener("click", onRemove);

          chip.appendChild(btn);
          return chip;
        };

        if (state.quickFilter) {
          const qfLabel =
            state.quickFilter.charAt(0).toUpperCase() +
            state.quickFilter.slice(1);
          wrap.appendChild(
            createChip(
              qfLabel,
              () => {
                state.quickFilter = null;
                applyAndRender();
              },
              `Remove quick filter ${qfLabel}`,
            ),
          );
        }

        for (const [key, set] of Object.entries(state.filters)) {
          for (const val of set) {
            wrap.appendChild(
              createChip(
                val,
                () => {
                  state.filters[key].delete(val);
                  applyAndRender();
                },
                `Remove filter ${val}`,
              ),
            );
          }
        }
      }

      function renderGrid(minis) {
        const g = el("#grid");
        g.innerHTML = "";
        g.className = `grid ${state.viewMode === "list" ? "list-view" : ""}`;

        // ⚡ Bolt: Use DocumentFragment to batch DOM insertions and prevent layout thrashing
        const fragment = document.createDocumentFragment();

        for (const m of minis) {
          const card = document.createElement("article");
          card.className = "card";
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.addEventListener("click", () => openDetail(m));
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openDetail(m);
            }
          });

          const firstImage =
            m.images.main[0] ||
            m.images.after_paint[0] ||
            m.images.ai_art[0] ||
            PLACEHOLDER_SVG;

          const paintStatusClass = badgeClassForPaint(m.paint.status);

          if (state.viewMode === "list") {
            // More compact + extra info
            card.innerHTML = `
        <div class="thumb">
          <img loading="lazy" src="${escapeHtml(firstImage)}" alt="${escapeHtml(m.name)}"
               onerror="this.src='${PLACEHOLDER_SVG}'">
        </div>
        <div class="meta">
          <h3>${escapeHtml(m.name)}</h3>
          <div class="line">${escapeHtml(
            [m.type, m.size, m.usage.role].filter(Boolean).join(" • "),
          )}</div>
          <div class="extra">
            ${m.paint.status ? `Paint: ${escapeHtml(m.paint.status)}` : ""}
            ${m.paint.date ? ` • Painted: ${escapeHtml(m.paint.date)}` : ""}
            ${
              m.source.acquisition_date
                ? ` • Acquired: ${escapeHtml(m.source.acquisition_date)}`
                : ""
            }
          </div>
        </div>
      `;
          } else {
            // Original grid/tile view
            card.innerHTML = `
        <div class="ribbon ${paintStatusClass}"><span>${
          escapeHtml(m.paint.status) || "Unknown"
        }</span></div>
        <div class="thumb">
          <img loading="lazy" src="${escapeHtml(firstImage)}" alt="${escapeHtml(m.name)}"
               onerror="this.src='${PLACEHOLDER_SVG}'">
        </div>
        <div class="meta">
          <h3>${escapeHtml(m.name)}</h3>
          <div class="line">${escapeHtml(
            [m.type, m.size, m.usage.role].filter(Boolean).join(" • "),
          )}</div>
          <div class="line">${escapeHtml(
            [
              m.source.manufacturer,
              `Painter: ${m.paint.painter || "—"}`,
              m.location.room || m.location.storage,
            ]
              .filter(Boolean)
              .join(" • "),
          )}</div>
        </div>
      `;
          }

          fragment.appendChild(card);
        }

        g.appendChild(fragment);
      }

      function renderEmptyState(show) {
        el("#grid").style.display = show ? "none" : "grid";
        el("#emptyState").style.display = show ? "block" : "none";
      }

      function renderOptionCounts() {
        // ⚡ Bolt: Hoist loop invariant to avoid redundant string allocations
        const q = state.query.toLowerCase();
        const baseSet = allMinis.filter((m) => {
          if (!q) return true;
          return (m._searchText || "").includes(q);
        });

        // ⚡ Bolt: Initialize counts for all keys in one go
        const globalCounts = {};
        const keys = Object.keys(uniqueOptions);

        // ⚡ Bolt: Single pass over the filtered items, O(N) instead of O(K*N)
        for (const mini of baseSet) {
          for (const key of keys) {
            const value = filterValueGetters[key](mini);
            if (value) {
              const cacheKey = `${key}_${value}`;
              globalCounts[cacheKey] = (globalCounts[cacheKey] || 0) + 1;
            }
          }
        }

        // ⚡ Bolt: Use cached DOM elements and avoid redundant layout thrashing by checking current value
        for (const key of keys) {
          for (const v of uniqueOptions[key]) {
            const cacheKey = `${key}_${v}`;
            const countStr = String(globalCounts[cacheKey] || 0);
            if (optionCountCache[cacheKey] !== countStr) {
              optionCountCache[cacheKey] = countStr;
              const countEl = optionCountElements[cacheKey];
              if (countEl) {
                countEl.textContent = countStr;
              }
            }
          }
        }
      }

      function updateQuickFilterUI() {
        els("#quickFilters .chip").forEach((chip) => {
          chip.classList.toggle(
            "active",
            state.quickFilter === chip.dataset.key,
          );
          chip.setAttribute(
            "aria-pressed",
            state.quickFilter === chip.dataset.key ? "true" : "false",
          );
        });
      }

      function syncCheckboxes() {
        for (const [key, set] of Object.entries(state.filters)) {
          for (const v of uniqueOptions[key]) {
            const cb = checkboxElementsCache[`${key}_${v}`];
            if (cb) {
              const shouldBeChecked = set.has(v);
              if (cb.checked !== shouldBeChecked) {
                cb.checked = shouldBeChecked;
              }
            }
          }
        }
      }

      function toggleViewMode() {
        state.viewMode = state.viewMode === "grid" ? "list" : "grid";
        updateViewModeUI();
        applyAndRender();
      }

      function updateViewModeUI() {
        const btn = el("#viewModeBtn");
        const iconContainer = el("#viewModeIconContainer");
        if (state.viewMode === "list") {
          iconContainer.innerHTML = ICONS.list;
          btn.setAttribute("aria-label", "Toggle grid view");
        } else {
          iconContainer.innerHTML = ICONS.grid;
          btn.setAttribute("aria-label", "Toggle list view");
        }
      }

      function badgeClassForPaint(status) {
        const s = (status || "").toLowerCase();
        if (s === "painted") return "ok";
        if (s === "primed" || s === "needs touch-up") return "warn";
        return "danger";
      }

      function renderStats(all, filtered) {
        // This function can be implemented if needed
      }

      let carouselIndex = 0;
      let carouselImages = [];
      let lightboxIndex = 0;
      let lightboxImages = [];
      let isDragging = false;
      let startX, startY, translateX, translateY;
      // FIXED: Add a flag to track if the dialog was open
      let wasDialogOpen = false;

      function openDetail(m) {
        el("#detailTitle").textContent = m.name || m.id || "Mini details";
        setupCarousel(m);

        const detailContent = el("#detailContent");
        detailContent.innerHTML = ""; // Clear previous content

        const kvData = {
          Identity: [
            ["ID", m.id],
            ["Type", m.type],
            ["Size", m.size],
          ],
          Source: [
            ["Manufacturer", m.source.manufacturer],
            ["Set", m.source.set],
            ["Origin", m.source.origin_type],
            ["Acquired", m.source.acquisition_date],
          ],
          Location: [
            ["Room", m.location.room],
            ["Storage", m.location.storage],
          ],
          Paint: [
            ["Status", m.paint.status],
            ["Painter", m.paint.painter],
            ["Date", m.paint.date],
            ["Brands", (m.paint.brand || []).join(", ")],
          ],
          Usage: [
            ["Role", m.usage.role],
            ["Campaigns", (m.usage.campaigns || []).join(", ")],
            ["Condition", m.condition],
            ["Tags", (m.tags || []).join(", ")],
          ],
        };

        for (const groupName in kvData) {
          const groupData = kvData[groupName].filter(([k, v]) => v);
          if (groupData.length > 0) {
            const groupEl = document.createElement("div");
            groupEl.className = "kv-group";
            const h4 = document.createElement("h4");
            h4.textContent = groupName;
            groupEl.appendChild(h4);

            const kvEl = document.createElement("div");
            kvEl.className = "kv";
            for (const [k, v] of groupData) {
              kvEl.innerHTML += `<div class="k">${escapeHtml(k)}</div><div>${escapeHtml(v)}</div>`;
            }
            groupEl.appendChild(kvEl);
            detailContent.appendChild(groupEl);
          }
        }

        if (m.notes) {
          const notesEl = document.createElement("div");
          notesEl.className = "notes";
          notesEl.textContent = m.notes;
          detailContent.appendChild(notesEl);
        }

        el("#shareMiniBtn").onclick = () => {
          const miniUrl = `${location.origin}${
            location.pathname
          }?id=${encodeURIComponent(m.id)}`;
          navigator.clipboard
            .writeText(miniUrl)
            .then(() => showToast("Link copied to clipboard!"))
            .catch(() => showToast("Could not copy link.", true));
        };

        el("#detailDialog").showModal();
        // No longer need to call lucide.createIcons() here.
      }

      function setupCarousel(m) {
        const track = el("#carouselTrack");
        const filmstrip = el("#carouselFilmstrip");
        track.innerHTML = "";
        filmstrip.innerHTML = "";
        carouselIndex = 0;
        carouselImages = [];

        const addImages = (arr, label) => {
          arr.forEach((src) => carouselImages.push({ src, label }));
        };

        addImages(m.images.main, "Main");
        addImages(m.images.after_paint, "After Paint");
        addImages(m.images.ai_art, "AI Art");
        addImages(m.images.reference, "Reference");
        addImages(m.images.before_paint, "Before Paint");

        if (carouselImages.length === 0) {
          carouselImages.push({ src: PLACEHOLDER_SVG, label: "No Image" });
        }

        carouselImages.forEach((imgData, index) => {
          const slide = document.createElement("div");
          slide.className = "carousel-slide";
          slide.innerHTML = `
            <img loading="lazy" src="${escapeHtml(imgData.src)}" alt="${escapeHtml(m.name)} - ${escapeHtml(imgData.label)}" onerror="this.src='${PLACEHOLDER_SVG}'">
            <div class="carousel-label">${escapeHtml(imgData.label)}</div>
          `;
          slide
            .querySelector("img")
            .addEventListener("click", () => openLightbox(index));
          track.appendChild(slide);

          const thumb = document.createElement("div");
          thumb.className = "filmstrip-thumb";
          thumb.dataset.index = index;
          thumb.innerHTML = `<img src="${escapeHtml(imgData.src)}" alt="Thumbnail ${
            index + 1
          }" onerror="this.src='${PLACEHOLDER_SVG}'">`;
          thumb.addEventListener("click", () => {
            carouselIndex = index;
            updateCarousel();
          });
          filmstrip.appendChild(thumb);
        });

        updateCarousel();
      }

      function updateCarousel() {
        const track = el("#carouselTrack");
        track.style.transform = `translateX(-${carouselIndex * 100}%)`;
        const hasMultiple = carouselImages.length > 1;
        el("#carouselPrev").style.display = hasMultiple ? "flex" : "none";
        el("#carouselNext").style.display = hasMultiple ? "flex" : "none";

        els(".filmstrip-thumb").forEach((thumb) => {
          thumb.classList.toggle(
            "active",
            parseInt(thumb.dataset.index) === carouselIndex,
          );
        });
      }

      el("#carouselPrev").addEventListener("click", () => {
        carouselIndex =
          (carouselIndex - 1 + carouselImages.length) % carouselImages.length;
        updateCarousel();
      });

      el("#carouselNext").addEventListener("click", () => {
        carouselIndex = (carouselIndex + 1) % carouselImages.length;
        updateCarousel();
      });

      // FIXED: Temporarily close the dialog to show the lightbox
      function openLightbox(index) {
        wasDialogOpen = el("#detailDialog").open;
        if (wasDialogOpen) {
          el("#detailDialog").close();
        }

        lightboxImages = carouselImages;
        lightboxIndex = index;
        updateLightboxImage();
        el("#lightbox").classList.add("show");
        window.addEventListener("keydown", handleLightboxKeys);
      }

      // FIXED: Re-open the dialog if it was open before
      function closeLightbox() {
        const lb = el("#lightbox");
        if (!lb.classList.contains("show")) return;
        lb.classList.remove("show");
        resetLightboxImage();
        window.removeEventListener("keydown", handleLightboxKeys);

        if (wasDialogOpen) {
          el("#detailDialog").showModal();
          wasDialogOpen = false; // Reset flag
        }
      }

      function updateLightboxImage() {
        resetLightboxImage();
        el("#lightboxImg").src = lightboxImages[lightboxIndex].src;
        const hasMultiple = lightboxImages.length > 1;
        el(".lightbox-prev").style.display = hasMultiple ? "flex" : "none";
        el(".lightbox-next").style.display = hasMultiple ? "flex" : "none";
      }

      function resetLightboxImage() {
        const img = el("#lightboxImg");
        img.style.transform = "scale(1) translate(0, 0)";
      }

      function handleLightboxKeys(e) {
        if (e.key === "ArrowRight") el(".lightbox-next").click();
        if (e.key === "ArrowLeft") el(".lightbox-prev").click();
      }

      el(".lightbox-close").addEventListener("click", closeLightbox);
      el(".lightbox-prev").addEventListener("click", () => {
        lightboxIndex =
          (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
        updateLightboxImage();
      });
      el(".lightbox-next").addEventListener("click", () => {
        lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
        updateLightboxImage();
      });

      const lightboxImg = el("#lightboxImg");
      lightboxImg.addEventListener("wheel", (e) => {
        e.preventDefault();
        const scaleMatch =
          lightboxImg.style.transform.match(/scale\(([^)]+)\)/);
        let scale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;
        const delta = e.deltaY < 0 ? 0.2 : -0.2;
        const newScale = Math.max(1, Math.min(scale + delta, 5));
        lightboxImg.style.transform = `scale(${newScale})`;
      });

      lightboxImg.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        const scaleMatch =
          lightboxImg.style.transform.match(/scale\(([^)]+)\)/);
        if (!scaleMatch || parseFloat(scaleMatch[1]) <= 1) return;
        e.preventDefault();
        isDragging = true;
        lightboxImg.classList.add("grabbing");
        const transform = new DOMMatrix(
          getComputedStyle(lightboxImg).transform,
        );
        startX = e.clientX - transform.e;
        startY = e.clientY - transform.f;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        e.preventDefault();
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        const scaleMatch =
          lightboxImg.style.transform.match(/scale\(([^)]+)\)/);
        const scale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;
        lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        lightboxImg.classList.remove("grabbing");
      });

      lightboxImg.addEventListener("dblclick", resetLightboxImage);

      function randomSelect() {
        const filtered = filterMinis(allMinis);
        if (filtered.length === 0) return;
        const idx = Math.floor(Math.random() * filtered.length);
        openDetail(filtered[idx]);
      }

      function slug(s) {
        return String(s)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      init();
    </script>
  </body>
